<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Anmol Dhiman — Software engineer: AI, automation, secure systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0618"/><stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="url(#neon)" stroke-opacity="0.7" stroke-width="2"/>
  <text x="60" y="62" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" fill="#00e5ff" fill-opacity="0.9">
    &gt; whoami<tspan fill="#ff2bd6"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/> ▌</tspan>
  </text>
  <text x="60" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#neon)" filter="url(#glow)">Anmol Dhiman</text>
  <text x="62" y="188" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#e9e4f5">Software Engineer · AI · Automation · Secure Systems</text>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16">
    <rect x="62" y="206" width="336" height="30" rx="15" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.7"/>
    <circle cx="82" cy="221" r="5" fill="#00e5ff"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="96" y="227" fill="#00e5ff">open to full-time / new-grad</text>
  </g>
  <g stroke="url(#neon)" stroke-width="2" fill="none" stroke-opacity="0.85">
    <path d="M900 40 L1140 40 L1140 100"/><path d="M1040 220 L1140 220 L1140 160"/>
  </g>
  <g fill="none" stroke="#00e5ff" stroke-opacity="0.35">
    <circle cx="1010" cy="130" r="60"/><circle cx="1010" cy="130" r="38" stroke="#ff2bd6"/><circle cx="1010" cy="130" r="16" stroke="#7c3aed"/>
  </g>
</svg>
